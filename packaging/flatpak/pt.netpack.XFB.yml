# Flatpak manifest for XFB.
#
#   flatpak-builder --force-clean --user --install build-flatpak \
#       packaging/flatpak/pt.netpack.XFB.yml
#   flatpak run pt.netpack.XFB
#
# Built and verified 2026-09-11 with build-flatpak-docker.sh, which runs
# flatpak-builder in a privileged container. The three CHECKs this file used to
# carry are answered where they stood.
#
# The design decision behind this file: yt-dlp is NOT bundled. It goes stale in
# days — YouTube changes and an old yt-dlp simply fails — and a read-only
# /app would freeze whatever version shipped. XFB already downloads the official
# standalone yt-dlp into ~/.local/bin and prefers it over any system copy, so it
# can self-update (DependencyChecker::ensureYtDlp, and the note above
# findYtDlpExecutable). Inside the sandbox that path is the app's own writable
# home, so the mechanism works here unchanged. ffmpeg is the opposite case: it
# is needed for waveforms, BPM, durations, cover art and conversion, none of
# which can wait on a download, so it is built in.
app-id: pt.netpack.XFB
runtime: org.kde.Platform
# 6.9 never existed. Flathub carries 6.10 and 6.11 (plus the old 5.15-25.08);
# 6.11 is the newest and matches the Qt that Fedora 44 already builds XFB with.
# Check `flatpak remote-ls flathub --columns=application,branch | grep org.kde.Sdk`
# before moving it again.
runtime-version: '6.11'
sdk: org.kde.Sdk
command: XFB
rename-desktop-file: XFB.desktop
rename-icon: xfb_icon

finish-args:
  # Display, and the GPU for the waveform and deck views.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Qt has to be told to try Wayland first, and this line is the whole reason
  # a 4.0 flatpak would not start on someone's desk (reported 2026-09-16).
  # Qt's own default platform on Linux is plain "xcb"; nothing but a session
  # that exports QT_QPA_PLATFORM itself moves it, and Plasma does that while
  # GNOME does not. So on a GNOME Wayland desk Qt asks for xcb -- and
  # fallback-x11 withholds the X11 socket precisely when a Wayland socket was
  # granted, which is precisely when Qt asks. DISPLAY is then unset, the xcb
  # plugin has nothing to connect to, and QApplication aborts:
  #     qt.qpa.xcb: could not connect to display
  #     This application failed to start because no Qt platform plugin could
  #     be initialized.
  # (Qt also prints a line about xcb-cursor0 there. It prints that whenever
  # the xcb plugin fails, whatever the cause, and it is not the cause here:
  # the runtime carries the library, and the plugin never got as far as a
  # cursor.) Qt 6 reads this variable as a ';'-separated list and keeps the
  # first plugin that loads, so an X11 desk still ends up on xcb: the wayland
  # plugin returns nothing there rather than dying, and Qt tries the next
  # name. An operator who wants to force one can still pass
  # `flatpak run --env=QT_QPA_PLATFORM=xcb pt.netpack.XFB`, which overrides
  # this.
  - --env=QT_QPA_PLATFORM=wayland;xcb

  # Audio. XFB is a playout system; without this it has nothing to do.
  - --socket=pulseaudio

  # The station's own network: Icecast, the phone sync server, the public
  # now-playing page, and fetching yt-dlp on first use.
  - --share=network

  # The music library lives wherever the operator keeps it, and ~/.local/bin is
  # where the self-updating yt-dlp goes.
  # STILL TO CHECK, and it needs a real desktop rather than a container:
  # whether ~/.var/app/pt.netpack.XFB is mounted noexec. The whole yt-dlp
  # design depends on running a downloaded binary from the app's writable
  # home, and that directory is an ordinary directory in $HOME, so it inherits
  # whatever that filesystem was mounted with — nothing flatpak decides, and
  # nothing a container can tell you about the operator's machine. Test on the
  # Fedora box: flatpak run --command=sh pt.netpack.XFB, drop a script in
  # ~/.local/bin, chmod +x, run it.
  - --filesystem=home

  # Accessibility. This is not optional for XFB: the app is used without sight,
  # and Qt reaches a screen reader over the AT-SPI bus. Without this a blind
  # operator is told nothing at all — the same fault the Fedora RPM had before
  # at-spi2-core was named as a dependency.
  - --talk-name=org.a11y.Bus

  # "XFB is on air" / dead-air alerts.
  - --talk-name=org.freedesktop.Notifications

modules:
  # ffmpeg's command-line tools. The KDE runtime carries the libav* libraries
  # Qt Multimedia links against, but not the ffmpeg and ffprobe binaries, and
  # XFB shells out to both constantly.
  # The org.freedesktop.Platform.ffmpeg-full extension is not a way out of
  # this: Flathub publishes it for branch 24.08 only, and the KDE 6.11 runtime
  # is built on 25.08, so there is no matching branch to depend on. Building it
  # here costs most of the build time; revisit if a 25.08 branch appears.
  - name: ffmpeg
    config-opts:
      - --disable-debug
      - --disable-doc
      - --disable-static
      - --enable-shared
      - --enable-gpl
      - --enable-libopus
      - --enable-libmp3lame
      - --enable-libvorbis
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
        # Verified against the published tarball 2026-09-11.
        sha256: 40973d44970dbc83ef302b0609f2e74982be2d85916dd2ee7472d30678a7abe6
    modules:
      - name: lame
        config-opts:
          # --disable-frontend because the `lame` command-line tool is not
          # wanted here and does not link in the SDK anyway: its console.c
          # needs tgetent/tgetstr/tgetnum, which live in libtinfo rather than
          # the -lncurses its Makefile asks for. Only libmp3lame is needed, and
          # shared so that ffmpeg's own shared libraries can link it.
          - --disable-frontend
          - --disable-static
          - --enable-shared
        sources:
          - type: archive
            url: https://downloads.sourceforge.net/lame/lame-3.100.tar.gz
            # Ends 1e, not 4e. The 4e written here first was a slip, and it is
            # the kind that only shows up minutes into a build.
            sha256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e

  - name: xfb
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
    post-install:
      # Flathub wants the desktop file, icon and metainfo named for the app id.
      # rename-desktop-file and rename-icon above handle the first two; the
      # metainfo is installed here because CMake knows nothing about it.
      - install -Dm644 packaging/flatpak/pt.netpack.XFB.metainfo.xml
          /app/share/metainfo/pt.netpack.XFB.metainfo.xml
